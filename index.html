<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>判定メーカー — HITBOX VIEWER</title>
<style>
  :root {
    --bg: #101318;
    --panel: #191f28;
    --panel-2: #212936;
    --line: #2c3646;
    --text: #e8ecf2;
    --text-dim: #8b96a5;
    --hit: #e8394a;
    --hurt: #2e7ce8;
    --throw: #b04fe0;
    --push: #3dbe7b;
    --accent: #f2c14e;
    font-size: 15px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  header h1 {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 1rem;
    letter-spacing: .18em;
    color: var(--accent);
    text-transform: uppercase;
  }
  header h1 span { color: var(--text-dim); font-weight: 400; }
  header .spacer { flex: 1; }

  button {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--text-dim); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); color: #14100a; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .4; cursor: default; }

  main { flex: 1; display: flex; min-height: 0; }

  #stage-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    min-width: 0;
    background:
      repeating-linear-gradient(0deg, transparent 0 39px, #ffffff06 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, #ffffff06 39px 40px),
      var(--bg);
  }
  #stage {
    max-width: 100%;
    max-height: 100%;
    box-shadow: 0 8px 40px #0009;
    cursor: crosshair;
    touch-action: none;
  }
  #dropzone {
    position: absolute;
    inset: 24px;
    border: 2px dashed var(--line);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-dim);
    text-align: center;
    padding: 20px;
  }
  #dropzone.hidden { display: none; }
  #dropzone strong { color: var(--text); font-size: 1.1rem; }
  #dropzone.dragover { border-color: var(--accent); color: var(--accent); }

  aside {
    width: 300px;
    flex: none;
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  aside section { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  aside h2 {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .72rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .type-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    text-align: left;
    font-size: .85rem;
  }
  .type-btn .swatch {
    width: 14px; height: 14px;
    border-radius: 2px;
    border: 2px solid;
    flex: none;
  }
  .type-btn.active { border-color: var(--accent); background: #f2c14e14; }

  .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .row label { font-size: .8rem; color: var(--text-dim); flex: none; width: 5.5em; }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  .row output { font-size: .8rem; width: 3em; text-align: right; }

  #box-list { display: flex; flex-direction: column; gap: 6px; }
  #box-list:empty::after {
    content: "まだ判定がありません。画像の上をドラッグして追加。";
    color: var(--text-dim);
    font-size: .8rem;
  }
  .box-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--panel-2);
    cursor: pointer;
    font-size: .8rem;
  }
  .box-item.selected { border-color: var(--accent); }
  .box-item .swatch { width: 12px; height: 12px; border-radius: 2px; border: 2px solid; flex: none; }
  .box-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .box-item .dims { color: var(--text-dim); }
  .box-item button {
    padding: 2px 7px;
    font-size: .75rem;
    line-height: 1.2;
  }

  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  details summary {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .72rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }
  details summary:hover { color: var(--text); }
  details[open] summary { margin-bottom: 6px; }
  select {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px;
    flex: 1;
    min-width: 0;
  }
  .hint { font-size: .75rem; color: var(--text-dim); line-height: 1.6; }
  kbd {
    font-family: ui-monospace, monospace;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0 5px;
    font-size: .85em;
  }
  input[type="file"] { display: none; }

  #flash {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
  }
  #flash span {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: clamp(2.2rem, 7vw, 5rem);
    font-weight: 800;
    font-style: italic;
    letter-spacing: .08em;
    color: var(--accent);
    -webkit-text-stroke: 2px #14100a;
    text-shadow: 0 0 24px #f2c14e88, 4px 4px 0 #14100a;
    transform: skewX(-8deg);
    white-space: nowrap;
  }
  #flash.go { animation: flash-pop 1.1s ease-out forwards; }
  @keyframes flash-pop {
    0%   { opacity: 0; transform: scale(2.4); }
    18%  { opacity: 1; transform: scale(1); }
    75%  { opacity: 1; transform: scale(1.04); }
    100% { opacity: 0; transform: scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce) {
    #flash.go { animation: none; opacity: 1; transition: opacity .2s; }
  }

  /* ---- モバイル ---- */
  @media (max-width: 760px) {
    body { overflow: auto; }
    header { flex-wrap: wrap; gap: 8px; padding: 10px 12px; position: sticky; top: 0; z-index: 20; }
    header h1 { font-size: .9rem; }
    header button { padding: 9px 12px; font-size: .85rem; }
    main { flex-direction: column; overflow: visible; }
    #stage-wrap {
      flex: none;
      height: 58vh;
      min-height: 300px;
      padding: 10px;
    }
    #dropzone { inset: 14px; font-size: .9rem; }
    aside {
      width: 100%;
      border-left: none;
      border-top: 1px solid var(--line);
      overflow: visible;
    }
    aside section { padding: 12px 14px; }
    .type-btn, .box-item button, button { min-height: 42px; } /* タッチターゲット */
    .box-item { padding: 10px; }
    input[type="range"] { height: 32px; }
    .hint kbd { display: inline; }
  }
</style>
</head>
<body>
<header>
  <h1>Hitbox<span>_</span>Maker</h1>
  <div class="spacer"></div>
  <button id="btn-open">画像を開く</button>
  <button id="btn-clear">全消去</button>
  <button id="btn-copy" disabled>コピー</button>
  <button id="btn-export" class="primary" disabled>PNG書き出し</button>
  <input type="file" id="file-input" accept="image/*">
</header>

<main>
  <div id="stage-wrap">
    <canvas id="stage" width="800" height="600"></canvas>
    <div id="dropzone">
      <strong>画像を入れると勝手に食らい判定が付きます</strong>
      <span>タップして選択 / ドラッグ&ドロップ / <kbd>⌘V</kbd> ペースト<br>解析はぜんぶ端末の中。どこにも送信されません</span>
      <button id="btn-sample">サンプル画像で試す</button>
    </div>
    <div id="flash" aria-hidden="true"><span>判定付与!!</span></div>
  </div>

  <aside>
    <section>
      <h2>判定タイプ</h2>
      <div class="type-grid" id="type-grid"></div>
    </section>

    <section>
      <div class="btn-row">
        <button id="btn-ai" class="primary" disabled>AI再解析</button>
        <button id="btn-ai-clear" disabled>AI分を消す</button>
        <button id="btn-mask" disabled>抽出を見る</button>
      </div>
      <div class="row">
        <label for="ai-grid">粗さ</label>
        <input type="range" id="ai-grid" min="6" max="40" value="20">
        <output id="ai-grid-out" class="mono">20</output>
      </div>
      <p class="hint" id="ai-status">画像を入れると自動で食らい判定が付きます。初回のみAIモデルをダウンロード。</p>
    </section>

    <section style="flex:1">
      <h2>レイヤー</h2>
      <div id="box-list"></div>
    </section>

    <section>
      <details>
        <summary>詳細設定</summary>
        <div class="row">
          <label for="opacity">塗り</label>
          <input type="range" id="opacity" min="0" max="100" value="30">
          <output id="opacity-out" class="mono">30%</output>
        </div>
        <div class="row">
          <label for="stroke">枠線</label>
          <input type="range" id="stroke" min="1" max="10" value="3">
          <output id="stroke-out" class="mono">3px</output>
        </div>
        <div class="row">
          <label for="ai-cover">カバー率</label>
          <input type="range" id="ai-cover" min="50" max="98" value="92">
          <output id="ai-cover-out" class="mono">92%</output>
        </div>
        <div class="row">
          <label for="ai-model">モデル</label>
          <select id="ai-model">
            <option value="isnet_fp16" selected>標準 (isnet_fp16)</option>
            <option value="isnet">高精度 (isnet)</option>
            <option value="isnet_quint8">軽量 (isnet_quint8)</option>
          </select>
        </div>
      </details>
    </section>

    <section>
      <details>
        <summary>操作ヘルプ</summary>
        <p class="hint">
          ドラッグ … 新規ボックス<br>
          ボックス内ドラッグ … 移動<br>
          角ハンドル … リサイズ<br>
          <kbd>Delete</kbd> … 選択を削除<br>
          <kbd>⌘Z</kbd> … 取り消し<br>
          <kbd>1</kbd>–<kbd>4</kbd> … タイプ切替
        </p>
      </details>
    </section>
  </aside>
</main>

<script>
const TYPES = [
  { id: 'hit',   label: '攻撃判定', color: '#e8394a', key: '1' },
  { id: 'hurt',  label: '食らい判定', color: '#2e7ce8', key: '2' },
  { id: 'throw', label: '投げ判定', color: '#b04fe0', key: '3' },
  { id: 'push',  label: '押し合い', color: '#3dbe7b', key: '4' },
];

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const dropzone = document.getElementById('dropzone');
const stageWrap = document.getElementById('stage-wrap');
const fileInput = document.getElementById('file-input');
const boxList = document.getElementById('box-list');
const exportBtn = document.getElementById('btn-export');

let img = null;
let boxes = [];          // {id, type, x, y, w, h} 画像ピクセル座標
let nextId = 1;
let currentType = 'hit';
let selectedId = null;
let fillOpacity = 0.30;
let strokeWidth = 3;

// ---- 判定タイプUI ----
const typeGrid = document.getElementById('type-grid');
for (const t of TYPES) {
  const b = document.createElement('button');
  b.className = 'type-btn' + (t.id === currentType ? ' active' : '');
  b.dataset.type = t.id;
  b.innerHTML = `<span class="swatch" style="border-color:${t.color};background:${t.color}44"></span>${t.label}`;
  b.onclick = () => setType(t.id);
  typeGrid.appendChild(b);
}
function setType(id) {
  currentType = id;
  for (const b of typeGrid.children) b.classList.toggle('active', b.dataset.type === id);
  if (selectedId != null) {
    const box = boxes.find(b => b.id === selectedId);
    if (box) { box.type = id; render(); }
  }
}
function typeOf(id) { return TYPES.find(t => t.id === id); }

// ---- スライダー ----
const opacityEl = document.getElementById('opacity');
const strokeEl = document.getElementById('stroke');
opacityEl.oninput = () => {
  fillOpacity = opacityEl.value / 100;
  document.getElementById('opacity-out').textContent = opacityEl.value + '%';
  render();
};
strokeEl.oninput = () => {
  strokeWidth = +strokeEl.value;
  document.getElementById('stroke-out').textContent = strokeEl.value + 'px';
  render();
};

// ---- 画像読み込み ----
document.getElementById('btn-open').onclick = () => fileInput.click();
dropzone.onclick = () => fileInput.click();
fileInput.onchange = () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); fileInput.value = ''; };

stageWrap.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
stageWrap.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
stageWrap.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadFile(f);
});
window.addEventListener('paste', e => {
  for (const item of e.clipboardData.items) {
    if (item.type.startsWith('image/')) { loadFile(item.getAsFile()); break; }
  }
});

function loadFile(file) {
  lastBlob = file;
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    img = im;
    canvas.width = im.naturalWidth;
    canvas.height = im.naturalHeight;
    boxes = [];
    selectedId = null;
    dropzone.classList.add('hidden');
    exportBtn.disabled = false;
    document.getElementById('btn-copy').disabled = false;
    history.length = 0;
    aiBtn.disabled = false;
    aiClearBtn.disabled = true;
    maskCache = null;
    maskOverlay = null;
    showMask = false;
    maskBtn.disabled = true;
    maskBtn.textContent = '抽出部分を見る';
    render();
    URL.revokeObjectURL(url);
    autoAnnotate(); // 入れたら勝手に食らい判定
  };
  im.src = url;
}

// ---- 座標変換 ----
function toImageCoords(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height),
  };
}
function handleSize() {
  const rw = canvas.getBoundingClientRect().width;
  return 10 * (rw > 0 ? canvas.width / rw : 1); // 表示上10px相当
}

// ---- ヒットテスト ----
function hitHandle(box, p) {
  const hs = handleSize();
  const corners = [
    ['nw', box.x, box.y], ['ne', box.x + box.w, box.y],
    ['sw', box.x, box.y + box.h], ['se', box.x + box.w, box.y + box.h],
  ];
  for (const [name, cx, cy] of corners) {
    if (Math.abs(p.x - cx) <= hs && Math.abs(p.y - cy) <= hs) return name;
  }
  return null;
}
function hitBox(p) {
  for (let i = boxes.length - 1; i >= 0; i--) {
    const b = boxes[i];
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b;
  }
  return null;
}

// ---- Undo ----
const history = [];
function snapshot() {
  history.push(JSON.stringify(boxes));
  if (history.length > 50) history.shift();
}
function undo() {
  // 変化のないスナップショット（選択クリックだけ等）はスキップ
  while (history.length) {
    const s = history.pop();
    if (s !== JSON.stringify(boxes)) {
      boxes = JSON.parse(s);
      selectedId = null;
      aiClearBtn.disabled = !boxes.some(b => b.aiGenerated);
      render();
      return;
    }
  }
}

// ---- ドラッグ操作 ----
let drag = null; // {mode:'draw'|'move'|'resize', ...}

canvas.addEventListener('pointerdown', e => {
  if (!img) return;
  canvas.setPointerCapture(e.pointerId);
  snapshot();
  const p = toImageCoords(e);
  const sel = boxes.find(b => b.id === selectedId);

  if (sel) {
    const h = hitHandle(sel, p);
    if (h) { drag = { mode: 'resize', box: sel, handle: h }; return; }
  }
  const target = hitBox(p);
  if (target) {
    selectedId = target.id;
    drag = { mode: 'move', box: target, ox: p.x - target.x, oy: p.y - target.y };
    render();
    return;
  }
  // 新規描画
  const box = { id: nextId++, type: currentType, x: p.x, y: p.y, w: 0, h: 0 };
  boxes.push(box);
  selectedId = box.id;
  drag = { mode: 'draw', box, sx: p.x, sy: p.y };
  render();
});

canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = toImageCoords(e);
  const b = drag.box;
  if (drag.mode === 'draw') {
    b.x = Math.min(drag.sx, p.x);
    b.y = Math.min(drag.sy, p.y);
    b.w = Math.abs(p.x - drag.sx);
    b.h = Math.abs(p.y - drag.sy);
  } else if (drag.mode === 'move') {
    b.x = p.x - drag.ox;
    b.y = p.y - drag.oy;
  } else if (drag.mode === 'resize') {
    const right = b.x + b.w, bottom = b.y + b.h;
    if (drag.handle.includes('w')) { b.w = right - p.x; b.x = p.x; }
    if (drag.handle.includes('e')) { b.w = p.x - b.x; }
    if (drag.handle.includes('n')) { b.h = bottom - p.y; b.y = p.y; }
    if (drag.handle.includes('s')) { b.h = p.y - b.y; }
  }
  render();
});

canvas.addEventListener('pointerup', () => {
  if (drag) {
    const b = drag.box;
    // 反転を正規化
    if (b.w < 0) { b.x += b.w; b.w = -b.w; }
    if (b.h < 0) { b.y += b.h; b.h = -b.h; }
    // 小さすぎる新規ボックスは破棄
    if (drag.mode === 'draw' && (b.w < 4 || b.h < 4)) {
      boxes = boxes.filter(x => x.id !== b.id);
      selectedId = null;
    }
    drag = null;
    render();
  }
});

// ---- キーボード ----
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
    undo();
    e.preventDefault();
    return;
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (selectedId != null) {
      snapshot();
      boxes = boxes.filter(b => b.id !== selectedId);
      selectedId = null;
      render();
      e.preventDefault();
    }
  }
  const t = TYPES.find(t => t.key === e.key);
  if (t) setType(t.id);
});

// ---- 描画 ----
function drawScene(c, uiLayer) {
  c.clearRect(0, 0, canvas.width, canvas.height);
  if (img) c.drawImage(img, 0, 0);
  const rw = canvas.getBoundingClientRect().width;
  const scale = rw > 0 ? canvas.width / rw : 1;
  const sw = Math.max(1, Math.round(strokeWidth * scale));

  // 同タイプの矩形は結合して1つの歪なシルエットとして描く
  const groups = new Map();
  for (const b of boxes) {
    if (!groups.has(b.type)) groups.set(b.type, []);
    groups.get(b.type).push(b);
  }
  for (const t of TYPES) {
    const list = groups.get(t.id);
    if (!list) continue;
    // 結合シルエット（不透明マスク）
    const m = document.createElement('canvas');
    m.width = canvas.width; m.height = canvas.height;
    const mc = m.getContext('2d');
    mc.fillStyle = t.color;
    for (const b of list) {
      // 整数座標にスナップ（小数座標だとAAで結合部に細い継ぎ目が出る）
      const x0 = Math.round(b.x), y0 = Math.round(b.y);
      mc.fillRect(x0, y0, Math.round(b.x + b.w) - x0, Math.round(b.y + b.h) - y0);
    }
    // 塗り: マスクごと半透明で載せる（重なりが濃くならない）
    c.globalAlpha = fillOpacity;
    c.drawImage(m, 0, 0);
    c.globalAlpha = 1;
    // 枠線: erode(S) = 8方向シフトの積集合。S - erode(S) が外周リング
    const e = document.createElement('canvas');
    e.width = canvas.width; e.height = canvas.height;
    const ec = e.getContext('2d');
    ec.drawImage(m, 0, 0);
    ec.globalCompositeOperation = 'destination-in';
    for (const [dx, dy] of [[sw,0],[-sw,0],[0,sw],[0,-sw],[sw,sw],[sw,-sw],[-sw,sw],[-sw,-sw]]) {
      ec.drawImage(m, dx, dy);
    }
    const o = document.createElement('canvas');
    o.width = canvas.width; o.height = canvas.height;
    const oc = o.getContext('2d');
    oc.drawImage(m, 0, 0);
    oc.globalCompositeOperation = 'destination-out';
    oc.drawImage(e, 0, 0);
    c.drawImage(o, 0, 0);
  }
  if (uiLayer && showMask && maskOverlay) {
    c.drawImage(maskOverlay, 0, 0); // 透過はoverlay側に焼き込み済み
  }
  if (uiLayer && selectedId != null) {
    const b = boxes.find(x => x.id === selectedId);
    if (b) {
      c.setLineDash([6 * scale, 4 * scale]);
      c.lineWidth = 1.5 * scale;
      c.strokeStyle = '#f2c14e';
      c.strokeRect(b.x - 3 * scale, b.y - 3 * scale, b.w + 6 * scale, b.h + 6 * scale);
      c.setLineDash([]);
      const hs = 5 * scale;
      c.fillStyle = '#f2c14e';
      for (const [cx, cy] of [[b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.h], [b.x + b.w, b.y + b.h]]) {
        c.fillRect(cx - hs, cy - hs, hs * 2, hs * 2);
      }
    }
  }
}

function render() {
  drawScene(ctx, true);
  renderList();
}

function renderList() {
  boxList.innerHTML = '';
  const counts = {};
  for (const b of boxes) {
    const t = typeOf(b.type);
    counts[b.type] = (counts[b.type] || 0) + 1;
    const item = document.createElement('div');
    item.className = 'box-item' + (b.id === selectedId ? ' selected' : '');
    item.innerHTML =
      `<span class="swatch" style="border-color:${t.color};background:${t.color}44"></span>` +
      `<span class="name">${t.label} ${counts[b.type]}</span>` +
      `<span class="dims mono">${Math.round(b.w)}×${Math.round(b.h)}</span>`;
    const del = document.createElement('button');
    del.textContent = '×';
    del.title = '削除';
    del.onclick = ev => {
      ev.stopPropagation();
      snapshot();
      boxes = boxes.filter(x => x.id !== b.id);
      if (selectedId === b.id) selectedId = null;
      render();
    };
    item.appendChild(del);
    item.onclick = () => { selectedId = b.id; render(); };
    boxList.appendChild(item);
  }
}

// ---- 全消去 / 書き出し ----
document.getElementById('btn-clear').onclick = () => {
  if (boxes.length && !confirm('すべての判定ボックスを削除します。よろしいですか？')) return;

  selectedId = null;
  render();
};

// ---- AI判定生成（RMBG-1.4 / onnxruntime-web） ----
const aiBtn = document.getElementById('btn-ai');
const aiClearBtn = document.getElementById('btn-ai-clear');
const aiStatus = document.getElementById('ai-status');
const aiGridEl = document.getElementById('ai-grid');
const aiCoverEl = document.getElementById('ai-cover');

const IMGLY_URL = 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm';

let removeBackgroundFn = null;
let lastBlob = null;   // 現在の画像の元Blob（imglyに渡す）
let maskCache = null;  // {data: Uint8ClampedArray(アルファ), w, h} 現在の画像のマスク
let maskOverlay = null; // デバッグ表示用のマスク着色キャンバス
let showMask = false;

aiGridEl.oninput = () => {
  document.getElementById('ai-grid-out').textContent = aiGridEl.value;
  if (maskCache) regenerateBoxes();
};
aiCoverEl.oninput = () => {
  document.getElementById('ai-cover-out').textContent = aiCoverEl.value + '%';
  if (maskCache) regenerateBoxes();
};

function setAiStatus(msg) { aiStatus.textContent = msg; }

async function getRemover() {
  if (!removeBackgroundFn) {
    setAiStatus('AIエンジンを読み込み中…');
    const mod = await import(IMGLY_URL);
    removeBackgroundFn = mod.removeBackground;
  }
  return removeBackgroundFn;
}

async function runSegmentation() {
  const removeBg = await getRemover();
  const fgBlob = await removeBg(lastBlob, {
    model: document.getElementById('ai-model').value,
    progress: (key, current, total) => {
      if (key.startsWith('fetch') && total) {
        setAiStatus(`モデルをダウンロード中… ${Math.round(current / total * 100)}% (初回のみ)`);
      }
    },
  });
  // 前景PNGのアルファをマスクとして取り出す
  const bmp = await createImageBitmap(fgBlob);
  const mc = document.createElement('canvas');
  mc.width = canvas.width; mc.height = canvas.height;
  const g = mc.getContext('2d');
  g.drawImage(bmp, 0, 0, canvas.width, canvas.height);
  const { data } = g.getImageData(0, 0, canvas.width, canvas.height);
  const n = canvas.width * canvas.height;
  const alpha = new Uint8ClampedArray(n);
  for (let i = 0; i < n; i++) alpha[i] = data[i * 4 + 3];
  keepLargestComponent(alpha, canvas.width, canvas.height);
  return { data: alpha, w: canvas.width, h: canvas.height };
}

// 最大連結成分だけ残す（飛び地除去）。ラベリングは縮小解像度で行いセル単位で反映
function keepLargestComponent(alpha, w, h) {
  const L = 256;
  const maxDim = Math.max(w, h);
  const lw = Math.max(8, Math.round(w * L / maxDim));
  const lh = Math.max(8, Math.round(h * L / maxDim));
  const cx = w / lw, cy = h / lh;
  const bin = new Uint8Array(lw * lh);
  for (let r = 0; r < lh; r++) {
    for (let c = 0; c < lw; c++) {
      // セル中央付近をサンプル
      const x = Math.min(w - 1, Math.floor((c + 0.5) * cx));
      const y = Math.min(h - 1, Math.floor((r + 0.5) * cy));
      if (alpha[y * w + x] > 127) bin[r * lw + c] = 1;
    }
  }
  // BFSでラベリングして最大成分を探す
  const label = new Int32Array(lw * lh).fill(-1);
  let bestLabel = -1, bestSize = 0, cur = 0;
  const queue = new Int32Array(lw * lh);
  for (let i = 0; i < lw * lh; i++) {
    if (!bin[i] || label[i] >= 0) continue;
    let head = 0, tail = 0, size = 0;
    queue[tail++] = i; label[i] = cur;
    while (head < tail) {
      const p = queue[head++]; size++;
      const pr = (p / lw) | 0, pc = p % lw;
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nr = pr + dr, nc = pc + dc;
        if (nr < 0 || nr >= lh || nc < 0 || nc >= lw) continue;
        const np = nr * lw + nc;
        if (bin[np] && label[np] < 0) { label[np] = cur; queue[tail++] = np; }
      }
    }
    if (size > bestSize) { bestSize = size; bestLabel = cur; }
    cur++;
  }
  if (bestLabel < 0) return;
  // 最大成分以外のセルはアルファを0に
  for (let y = 0; y < h; y++) {
    const r = Math.min(lh - 1, Math.floor(y / cy));
    for (let x = 0; x < w; x++) {
      const c = Math.min(lw - 1, Math.floor(x / cx));
      if (label[r * lw + c] !== bestLabel) alpha[y * w + x] = 0;
    }
  }
}

// 2値グリッド中の最大面積内接矩形（ヒストグラム法）
function largestRect(grid, ww, wh) {
  const heights = new Int32Array(ww);
  let best = null;
  for (let r = 0; r < wh; r++) {
    for (let c = 0; c < ww; c++) heights[c] = grid[r * ww + c] ? heights[c] + 1 : 0;
    // 単調スタックで最大長方形
    const stack = [];
    for (let c = 0; c <= ww; c++) {
      const h = c < ww ? heights[c] : 0;
      let start = c;
      while (stack.length && stack[stack.length - 1][1] > h) {
        const [s, sh] = stack.pop();
        const area = sh * (c - s);
        if (!best || area > best.area) best = { area, c: s, r: r - sh + 1, w: c - s, h: sh };
        start = s;
      }
      stack.push([start, h]);
    }
  }
  return best;
}

// マスク → 最大内接矩形の貪欲切り出し（残余がターゲット未満になるまで）
function maskToBoxes(mask, gridCount, coverTarget) {
  const WORK = 128;
  const maxDim = Math.max(mask.w, mask.h);
  const ww = Math.max(8, Math.round(mask.w * WORK / maxDim));
  const wh = Math.max(8, Math.round(mask.h * WORK / maxDim));
  const cx = mask.w / ww, cy = mask.h / wh;

  // 作業解像度に落とす（セル内アルファ平均で判定）
  const grid = new Uint8Array(ww * wh);
  let total = 0;
  for (let r = 0; r < wh; r++) {
    for (let c = 0; c < ww; c++) {
      let sum = 0, cnt = 0;
      const y0 = Math.floor(r * cy), y1 = Math.max(y0 + 1, Math.floor((r + 1) * cy));
      const x0 = Math.floor(c * cx), x1 = Math.max(x0 + 1, Math.floor((c + 1) * cx));
      const stepY = Math.max(1, (y1 - y0) >> 2), stepX = Math.max(1, (x1 - x0) >> 2);
      for (let y = y0; y < y1; y += stepY) {
        for (let x = x0; x < x1; x += stepX) {
          sum += mask.data[y * mask.w + x];
          cnt++;
        }
      }
      if (cnt && sum / cnt > 110) { grid[r * ww + c] = 1; total++; }
    }
  }
  if (!total) return [];

  // 貪欲切り出し: 大きい矩形から順に取り、残余がターゲット未満になったら終了
  const minCells = Math.max(1, Math.round(WORK / gridCount / 2)); // 粗さ→最小ボックス辺
  const rects = [];
  let remaining = total;
  while (remaining / total > 1 - coverTarget && rects.length < 40) {
    const rc = largestRect(grid, ww, wh);
    if (!rc || rc.w < minCells || rc.h < minCells) break;
    for (let r = rc.r; r < rc.r + rc.h; r++) {
      for (let c = rc.c; c < rc.c + rc.w; c++) {
        if (grid[r * ww + c]) { grid[r * ww + c] = 0; remaining--; }
      }
    }
    rects.push({ x: rc.c * cx, y: rc.r * cy, w: rc.w * cx, h: rc.h * cy });
  }
  return rects;
}

function regenerateBoxes() {
  snapshot();
  boxes = boxes.filter(b => !b.aiGenerated);
  const rects = maskToBoxes(maskCache, +aiGridEl.value, aiCoverEl.value / 100);
  for (const rc of rects) boxes.push({ id: nextId++, type: 'hurt', aiGenerated: true, ...rc });
  selectedId = null;
  aiClearBtn.disabled = rects.length === 0;
  setAiStatus(`食らい判定を ${rects.length} 個生成。スライダーで粗さ・密度を再調整できます。`);
  render();
}

const FUN_MESSAGES = [
  'キャラクターを目視確認中…',
  '骨格をスキャン中…',
  '弱い部分を探しています…',
  'フレームデータをでっち上げ中…',
  '食らい判定をペタペタ貼り付け中…',
];
let funTimer = null;
function startFunMessages() {
  let i = 0;
  setAiStatus(FUN_MESSAGES[0]);
  funTimer = setInterval(() => setAiStatus(FUN_MESSAGES[++i % FUN_MESSAGES.length]), 1400);
}
function stopFunMessages() { clearInterval(funTimer); funTimer = null; }

function playFlash() {
  const f = document.getElementById('flash');
  f.classList.remove('go');
  void f.offsetWidth; // アニメ再スタート
  f.classList.add('go');
}

function buildMaskOverlay() {
  const w = maskCache.w, h = maskCache.h;
  // シルエット（アクセント色、マスクのアルファそのまま）
  const s = document.createElement('canvas');
  s.width = w; s.height = h;
  const sg = s.getContext('2d');
  const id = sg.createImageData(w, h);
  for (let i = 0; i < maskCache.data.length; i++) {
    id.data[i * 4]     = 0xf2; // accent #f2c14e
    id.data[i * 4 + 1] = 0xc1;
    id.data[i * 4 + 2] = 0x4e;
    id.data[i * 4 + 3] = maskCache.data[i] > 127 ? 255 : 0;
  }
  sg.putImageData(id, 0, 0);
  // 太い輪郭 = S - erode(S)
  const t = Math.max(3, Math.round(Math.max(w, h) / 160));
  const e = document.createElement('canvas');
  e.width = w; e.height = h;
  const ec = e.getContext('2d');
  ec.drawImage(s, 0, 0);
  ec.globalCompositeOperation = 'destination-in';
  for (const [dx, dy] of [[t,0],[-t,0],[0,t],[0,-t],[t,t],[t,-t],[-t,t],[-t,-t]]) ec.drawImage(s, dx, dy);
  const ring = document.createElement('canvas');
  ring.width = w; ring.height = h;
  const rc = ring.getContext('2d');
  rc.drawImage(s, 0, 0);
  rc.globalCompositeOperation = 'destination-out';
  rc.drawImage(e, 0, 0);
  // 合成: 薄い塗り + 不透明の太い輪郭
  const m = document.createElement('canvas');
  m.width = w; m.height = h;
  const g = m.getContext('2d');
  g.globalAlpha = 0.15;
  g.drawImage(s, 0, 0);
  g.globalAlpha = 1;
  g.drawImage(ring, 0, 0);
  return m;
}

const maskBtn = document.getElementById('btn-mask');
maskBtn.onclick = () => {
  showMask = !showMask;
  maskBtn.textContent = showMask ? '抽出表示中 ✓' : '抽出部分を見る';
  render();
};

async function autoAnnotate() {
  aiBtn.disabled = true;
  startFunMessages();
  try {
    maskCache = await runSegmentation();
    maskOverlay = buildMaskOverlay();
    maskBtn.disabled = false;
    stopFunMessages();
    regenerateBoxes();
    playFlash();
  } catch (err) {
    console.error(err);
    stopFunMessages();
    setAiStatus('エラー: ' + err.message + ' — 「再解析」で再試行できます。');
  } finally {
    aiBtn.disabled = false;
  }
}

aiBtn.onclick = () => { if (img) autoAnnotate(); };
document.getElementById('ai-model').onchange = () => { if (img) autoAnnotate(); };

// ページ表示直後からエンジンを裏で先読み（ドロップ即解析のため）
setTimeout(() => { getRemover().catch(() => {}); }, 500);

aiClearBtn.onclick = () => {
  snapshot();
  boxes = boxes.filter(b => !b.aiGenerated);
  aiClearBtn.disabled = true;
  setAiStatus('AI生成分を削除しました。');
  render();
};

render();
</script>
